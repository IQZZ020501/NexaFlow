# Local development overrides for docker-compose.yml.
#
# Publishes the infrastructure ports to the host (so backend processes run
# directly on the host, e.g. `make dev`, can reach them) and pins readable
# container names. Production deployments should use docker-compose.yml alone.
#
# Usage (infrastructure only):
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.dev.yml up -d db redis qdrant
# Sandbox-capable worker for Python Tools and Workflow code nodes:
#   cd backend && make worker-compose

services:
  db:
    container_name: nexaflow-db
    ports:
      - "5432:5432"

  redis:
    container_name: nexaflow-redis
    ports:
      - "6379:6379"

  qdrant:
    container_name: nexaflow-qdrant
    ports:
      - "6333:6333"

  worker:
    env_file:
      - ../backend/.env
    volumes:
      - ../backend/storage:/data
