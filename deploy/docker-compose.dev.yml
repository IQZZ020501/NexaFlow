# Local development overrides for docker-compose.yml.
#
# Publishes the infrastructure ports to the host (so backend processes run
# directly on the host, e.g. `make dev`, can reach them) and pins readable
# container names. Production deployments should use docker-compose.server.yml
# (or the base file for a custom image build) instead.
#
# Usage (full local container dependencies):
#   docker compose --env-file .env -f deploy/docker-compose.yml -f deploy/docker-compose.dev.yml up -d --build --wait db redis qdrant sandbox worker

services:
  db:
    container_name: nexaflow-db
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  redis:
    container_name: nexaflow-redis
    ports:
      - "6379:6379"

  qdrant:
    container_name: nexaflow-qdrant
    ports:
      - "6333:6333"

  worker:
    build:
      context: ..
      dockerfile: deploy/dockerfiles/app.Dockerfile
      args:
        NEXAFLOW_API_PROXY: http://api:8000
    environment:
      ENVIRONMENT: development
    volumes:
      - ../backend/storage:/data
