x-app-image: &app-image
  image: ${NEXAFLOW_APP_IMAGE:-nexaflow/app:local}

services:
  db:
    image: ${NEXAFLOW_POSTGRES_IMAGE:-nexaflow/postgres-pg-search:0.25.2}
    build:
      context: ..
      dockerfile: deploy/dockerfiles/postgres.Dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexaflow}
      POSTGRES_USER: ${POSTGRES_USER:-nexaflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexaflow}
    volumes:
      - ./data/postgresql:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "PGAPPNAME=nexaflow-healthcheck pg_isready -U ${POSTGRES_USER:-nexaflow} -d ${POSTGRES_DB:-nexaflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.19.0
    volumes:
      - ./data/qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    <<: *app-image
    init: true
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    env_file: ../.env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: ""
      POSTGRES_DB: ${POSTGRES_DB:-nexaflow}
      POSTGRES_USER: ${POSTGRES_USER:-nexaflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexaflow}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
      KNOWLEDGE_STORAGE_DIR: /data/knowledge
      QDRANT_URL: http://qdrant:6333
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app-image
    init: true
    build:
      context: ..
      dockerfile: deploy/dockerfiles/app.Dockerfile
      args:
        NEXAFLOW_API_PROXY: http://api:8000
    env_file: ../.env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: ""
      POSTGRES_DB: ${POSTGRES_DB:-nexaflow}
      POSTGRES_USER: ${POSTGRES_USER:-nexaflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexaflow}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
      KNOWLEDGE_STORAGE_DIR: /data/knowledge
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ./data/uploads:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  worker:
    <<: *app-image
    init: true
    command: python scripts/worker.py --autoscale=10,0
    env_file: ../.env
    environment:
      AUTOSCALE_KEEPALIVE: "5"
      ENVIRONMENT: production
      DATABASE_URL: ""
      POSTGRES_DB: ${POSTGRES_DB:-nexaflow}
      POSTGRES_USER: ${POSTGRES_USER:-nexaflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexaflow}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
      KNOWLEDGE_STORAGE_DIR: /data/knowledge
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ./data/uploads:/data
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - KILL
      - SETGID
      - SETPCAP
      - SETUID
      - SYS_ADMIN
      - SYS_CHROOT
    security_opt:
      - no-new-privileges:true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  frontend:
    <<: *app-image
    working_dir: /opt/frontend
    command: ["/opt/node/bin/node", "server.js"]
    environment:
      HOSTNAME: 0.0.0.0
      NEXAFLOW_API_PROXY: http://api:8000
    ports:
      # Single public entrypoint. Next.js rewrites API/health/docs requests
      # to the internal api service.
      - "8000:3000"
    depends_on:
      - api
