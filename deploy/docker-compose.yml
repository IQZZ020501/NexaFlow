services:
  db:
    image: nexaflow/postgres-pg-search:0.25.2
    build:
      context: ..
      dockerfile: deploy/dockerfiles/postgres.Dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexaflow}
      POSTGRES_USER: ${POSTGRES_USER:-nexaflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexaflow}
    volumes:
      - ./data/postgresql:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexaflow} -d ${POSTGRES_DB:-nexaflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.19.0
    volumes:
      - ./data/qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    init: true
    build:
      context: ..
      dockerfile: deploy/dockerfiles/backend.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nexaflow}:${POSTGRES_PASSWORD:-nexaflow}@db:5432/${POSTGRES_DB:-nexaflow}
      CELERY_BROKER_URL: redis://redis:6379/0
      KNOWLEDGE_STORAGE_DIR: /data/knowledge
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ./data/uploads:/data
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  sandbox:
    init: true
    build:
      context: ..
      dockerfile: deploy/dockerfiles/sandbox.Dockerfile
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=0711,uid=0,gid=0
      - /dev/shm:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=0,gid=0
    volumes:
      - sandbox-socket:/run/sandbox
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - KILL
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped

  worker:
    init: true
    build:
      context: ..
      dockerfile: deploy/dockerfiles/backend.Dockerfile
    command: celery -A app.infrastructure.celery:celery_app worker --beat --queues=celery,agents-legacy,agents-v2 --loglevel=INFO
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nexaflow}:${POSTGRES_PASSWORD:-nexaflow}@db:5432/${POSTGRES_DB:-nexaflow}
      CELERY_BROKER_URL: redis://redis:6379/0
      KNOWLEDGE_STORAGE_DIR: /data/knowledge
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ./data/uploads:/data
      - sandbox-socket:/run/sandbox
    group_add:
      - "65533"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      sandbox:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: deploy/dockerfiles/frontend.Dockerfile
      args:
        NEXAFLOW_API_PROXY: http://api:8000
    environment:
      NEXAFLOW_API_PROXY: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  sandbox-socket:
