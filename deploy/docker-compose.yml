services:
  db:
    image: postgres:17-alpine
    container_name: nexaflow-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    volumes:
      - ./data/postgresql:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nexaflow-redis
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: nexaflow-qdrant
    ports:
      - "6333:6333"
    volumes:
      - ./data/qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    init: true
    build:
      context: ..
      dockerfile: deploy/dockerfiles/backend.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-app}
      CELERY_BROKER_URL: redis://redis:6379/0
      KNOWLEDGE_STORAGE_DIR: /data/knowledge
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ./data/uploads:/data
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  worker:
    init: true
    build:
      context: ..
      dockerfile: deploy/dockerfiles/backend.Dockerfile
    command: celery -A app.infrastructure.celery:celery_app worker --loglevel=INFO
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-app}
      CELERY_BROKER_URL: redis://redis:6379/0
      KNOWLEDGE_STORAGE_DIR: /data/knowledge
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ./data/uploads:/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  beat:
    build:
      context: ..
      dockerfile: deploy/dockerfiles/backend.Dockerfile
    command: celery -A app.infrastructure.celery:celery_app beat --loglevel=INFO
    env_file: .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      KNOWLEDGE_STORAGE_DIR: /data/knowledge
      QDRANT_URL: http://qdrant:6333
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: deploy/dockerfiles/frontend.Dockerfile
      args:
        NEXAFLOW_API_PROXY: http://api:8000
    environment:
      NEXAFLOW_API_PROXY: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
