services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexaflow}
      POSTGRES_USER: ${POSTGRES_USER:-nexaflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexaflow}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexaflow} -d ${POSTGRES_DB:-nexaflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: deploy/dockerfiles/backend.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nexaflow}:${POSTGRES_PASSWORD:-nexaflow}@db:5432/${POSTGRES_DB:-nexaflow}
      CELERY_BROKER_URL: redis://redis:6379/0
      KNOWLEDGE_STORAGE_DIR: /data/knowledge
      CHROMA_PERSIST_DIR: /data/chroma
    volumes:
      - uploads:/data
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: deploy/dockerfiles/backend.Dockerfile
    command: celery -A nexaflow.core.celery:celery_app worker --loglevel=INFO
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nexaflow}:${POSTGRES_PASSWORD:-nexaflow}@db:5432/${POSTGRES_DB:-nexaflow}
      CELERY_BROKER_URL: redis://redis:6379/0
      KNOWLEDGE_STORAGE_DIR: /data/knowledge
      CHROMA_PERSIST_DIR: /data/chroma
    volumes:
      - uploads:/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: ..
      dockerfile: deploy/dockerfiles/backend.Dockerfile
    command: celery -A nexaflow.core.celery:celery_app beat --loglevel=INFO
    env_file: .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: deploy/dockerfiles/frontend.Dockerfile
    environment:
      NEXAFLOW_API_PROXY: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  db-data:
  redis-data:
  uploads:
