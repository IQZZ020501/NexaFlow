name: nexaflow

x-app-image: &app-image
  image: registry.cn-shanghai.aliyuncs.com/ai-studios/nexaflow:latest

x-backend-environment: &backend-environment
  ENVIRONMENT: production
  DATABASE_URL: ""
  POSTGRES_DB: ${POSTGRES_DB:-nexaflow}
  POSTGRES_USER: ${POSTGRES_USER:-nexaflow}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  CELERY_BROKER_URL: redis://redis:6379/0
  KNOWLEDGE_STORAGE_DIR: /data/knowledge
  QDRANT_URL: http://qdrant:6333

services:
  db:
    image: registry.cn-shanghai.aliyuncs.com/ai-studios/nexaflow-postgres:0.25.2
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexaflow}
      POSTGRES_USER: ${POSTGRES_USER:-nexaflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - ./data/postgresql:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "PGAPPNAME=nexaflow-healthcheck pg_isready -U ${POSTGRES_USER:-nexaflow} -d ${POSTGRES_DB:-nexaflow}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.19.0
    restart: unless-stopped
    volumes:
      - ./data/qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    <<: *app-image
    init: true
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    env_file: ../.env
    environment: *backend-environment
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app-image
    init: true
    restart: unless-stopped
    env_file: ../.env
    environment: *backend-environment
    volumes:
      - ./data/uploads:/data/knowledge
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 20
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  sandbox:
    <<: *app-image
    init: true
    restart: unless-stopped
    working_dir: /opt/sandbox
    command: ["/usr/local/bin/python", "-m", "sandbox.server"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/python", "-m", "sandbox.healthcheck"]
      interval: 5s
      timeout: 2s
      retries: 20
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=0711,uid=0,gid=0
      - /dev/shm:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=0,gid=0
    volumes:
      - sandbox-socket:/run/sandbox
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - KILL
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 512m
    cpus: 1.0

  worker:
    <<: *app-image
    init: true
    restart: unless-stopped
    command:
      - celery
      - -A
      - app.infrastructure.celery:celery_app
      - worker
      - --beat
      - --autoscale=10,0
      - --queues=celery,agents-legacy,agents-v2
      - --loglevel=INFO
    env_file: ../.env
    environment:
      <<: *backend-environment
      AUTOSCALE_KEEPALIVE: "5"
    volumes:
      - ./data/uploads:/data/knowledge
      - sandbox-socket:/run/sandbox
    group_add:
      - "65533"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      sandbox:
        condition: service_healthy

  frontend:
    <<: *app-image
    restart: unless-stopped
    working_dir: /opt/frontend
    command: ["/opt/node/bin/node", "server.js"]
    environment:
      HOSTNAME: 0.0.0.0
      NEXAFLOW_API_PROXY: http://api:8000
    ports:
      - "${NEXAFLOW_PORT:-8080}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  sandbox-socket:
