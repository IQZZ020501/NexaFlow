# Optional reverse proxy for split hosting: API on :8000, Next.js on :3000.
# Used together with docker-compose.yml (service names as upstreams) or
# pointed at any other hosts running both runtimes.
server {
    listen 80;

    # Keep the proxy request-body ceiling aligned with the backend upload limit.
    client_max_body_size 100m;

    # API responses are authenticated and tenant-scoped: never cache them.
    # `^~` also prevents the static-asset regex locations below from ever
    # shadowing an API route that happens to end in a media extension.
    location ^~ /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js build assets carry hashed filenames, so they can be cached
    # forever: a new deploy changes the URL, never the content.
    location /_next/static/ {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # Static media (favicon, provider icons, fonts): unversioned filenames,
    # so use a moderate TTL instead of the immutable policy above.
    location ~* \.(svg|png|jpg|jpeg|gif|webp|ico|woff2?)$ {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
