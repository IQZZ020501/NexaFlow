name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies
        run: uv sync --dev --frozen

      - name: Compile Python
        run: uv run python -m compileall app tests main.py

      - name: Run unit tests
        run: uv run python -m tests.unit

      - name: Run logger tests
        run: uv run python -m tests.logger

      - name: Run identity tests
        run: uv run python -m tests.identity

      - name: Run workspace tests
        run: uv run python -m tests.workspaces

      - name: Run team tests
        run: uv run python -m tests.teams

      - name: Run knowledge tests
        run: uv run python -m tests.knowledge

      - name: Run llm tests
        run: uv run python -m tests.llm

      - name: Run agent tests
        run: uv run python -m tests.agents

      - name: Run main smoke tests
        run: uv run python -m tests.test_main

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test

      - name: Build
        run: bun run build
