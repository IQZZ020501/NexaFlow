name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        working-directory: .
        run: |
          cp .env.example .env
          docker compose --env-file .env -f deploy/docker-compose.yml config --quiet
          docker compose --env-file .env -f deploy/docker-compose.yml -f deploy/docker-compose.dev.yml config --quiet
          rm .env

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies
        run: uv sync --dev --frozen

      - name: Compile Python
        run: uv run python -m compileall app tests main.py

      - name: Run unit tests
        run: uv run python -m tests.unit

      - name: Run logger tests
        run: uv run python -m tests.logger

      - name: Run SMTP tests
        run: uv run python -m tests.smtp

      - name: Run email tests
        run: uv run python -m tests.email

      - name: Run system governance tests
        run: uv run python -m tests.system_governance

      - name: Run identity tests
        run: uv run python -m tests.identity

      - name: Run workspace tests
        run: uv run python -m tests.workspaces

      - name: Run team tests
        run: uv run python -m tests.teams

      - name: Run knowledge tests
        run: uv run python -m tests.knowledge

      - name: Run llm tests
        run: uv run python -m tests.llm

      - name: Run agent tests
        run: uv run python -m tests.agents

      - name: Run workflow tests
        run: uv run python -m tests.workflows

      - name: Run sandbox self-check
        working-directory: .
        run: |
          docker build --file deploy/dockerfiles/app.Dockerfile --target sandbox-runtime --tag nexaflow-sandbox-ci .
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=32m,mode=0711,uid=0,gid=0 \
            --tmpfs /dev/shm:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=0,gid=0 \
            --tmpfs /run/sandbox:rw,noexec,nosuid,nodev,size=1m,mode=0750,uid=0,gid=65533 \
            --entrypoint python nexaflow-sandbox-ci -m sandbox.self_check
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=32m,mode=0711,uid=0,gid=0 \
            --tmpfs /dev/shm:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=0,gid=0 \
            --tmpfs /run/sandbox:rw,noexec,nosuid,nodev,size=1m,mode=0750,uid=0,gid=65533 \
            --entrypoint python nexaflow-sandbox-ci -m sandbox.tests
          docker run --rm --network none \
            --cap-drop ALL \
            --cap-add CHOWN --cap-add KILL --cap-add SETGID --cap-add SETPCAP \
            --cap-add SETUID --cap-add SYS_ADMIN --cap-add SYS_CHROOT \
            --security-opt no-new-privileges:true \
            --env ENVIRONMENT=production \
            --env DATABASE_URL=postgresql://sandbox-must-not-see-this \
            --entrypoint python nexaflow-sandbox-ci \
            /opt/sandbox/worker.py --sandbox-self-check

      - name: Run main smoke tests
        run: uv run python -m tests.test_main

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test --parallel

      - name: Build
        run: bun run build
