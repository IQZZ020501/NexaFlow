name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        working-directory: .
        run: |
          cp .env.example .env
          docker compose --env-file .env -f deploy/docker-compose.yml config --quiet
          docker compose --env-file .env -f deploy/docker-compose.yml -f deploy/docker-compose.dev.yml config --quiet
          rm .env

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies
        run: uv sync --dev --frozen

      - name: Compile Python
        run: uv run python -m compileall app tests main.py

      - name: Run unit tests
        run: |
          uv run python -m tests.agents.unit
          uv run python -m tests.agents.harness
          uv run python -m tests.agent_skills.unit
          uv run python -m tests.execution.unit
          uv run python -m tests.knowledge.unit
          uv run python -m tests.tools.unit
          uv run python -m tests.workflows.unit
          uv run python -m tests.models.unit
          uv run python -m tests.platform.unit
          uv run python -m tests.infra.unit

      - name: Run Agent evaluation gate
        run: uv run python -m tests.agents.evaluation

      - name: Run logger tests
        run: uv run python -m tests.infra.logger

      - name: Run SMTP tests
        run: uv run python -m tests.identity.smtp

      - name: Run email tests
        run: uv run python -m tests.identity.email

      - name: Run system governance tests
        run: uv run python -m tests.platform.system_governance

      - name: Run identity tests
        run: uv run python -m tests.identity.identity

      - name: Run workspace tests
        run: uv run python -m tests.platform.workspaces

      - name: Run team tests
        run: uv run python -m tests.platform.teams

      - name: Run knowledge tests
        run: uv run python -m tests.knowledge.knowledge

      - name: Run llm tests
        run: uv run python -m tests.models.llm

      - name: Run agent tests
        run: uv run python -m tests.agents.agents

      - name: Run Skill package and invocation tests
        run: uv run python -m tests.agent_skills.api

      - name: Run MCP transport tests
        run: uv run python -m tests.infra.mcp_transports

      - name: Run workflow tests
        run: uv run python -m tests.workflows.workflows

      - name: Run OpenSandbox execution image checks
        working-directory: .
        run: |
          docker build --file deploy/dockerfiles/app.Dockerfile --target sandbox-runtime --tag nexaflow/execution:ci .
          docker run --rm --network none --read-only --user 65532:65532 \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --memory 512m --pids-limit 96 \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777 \
            --env DATABASE_URL=must-not-be-forwarded \
            --entrypoint /opt/nexaflow/.venv/bin/python nexaflow/execution:ci \
            -I /opt/nexaflow/self_check.py

      - name: Run architecture guard
        run: uv run python -m tests.infra.architecture

      - name: Run main smoke tests
        run: uv run python -m tests.smoke.test_main

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test --parallel

      - name: Build
        run: bun run build
