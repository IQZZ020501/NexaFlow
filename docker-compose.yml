name: nexaflow

# Edit these values before deployment. Keep real credentials private.
# Use strong passwords without "$", or escape each "$" as "$$" for Compose.
x-settings:
  postgres-password: &postgres-password "CHANGE_ME_Postgres_123!"
  admin-password: &admin-password "CHANGE_ME_Admin_123!"
  managed-user-password: &managed-user-password "CHANGE_ME_User_123!"
  sandbox-api-key: &sandbox-api-key "CHANGE_ME_OpenSandbox_API_Key"
  public-app-url: &public-app-url http://localhost:8080
  web-port: &web-port "8080:3000"
  # With an HTTPS reverse proxy, also set public-app-url to the HTTPS origin.
  environment: &environment development

# Published multi-architecture images; changing a digest selects a new release.
x-images:
  app: &application-image registry.cn-shanghai.aliyuncs.com/ai-studios/nexaflow@sha256:d741327eebf9bdaa3cfa0f26c8014ec7fb715818a285d2edef91c8733552de06
  postgres: &postgres-image registry.cn-shanghai.aliyuncs.com/ai-studios/nexaflow-postgres@sha256:956799fcfbe928ea4cc44c7daa331405ce808ba55de918118ed83fe6025867df
  execution: &execution-image registry.cn-shanghai.aliyuncs.com/ai-studios/nexaflow-execution@sha256:0c4215a17f9111251e226373c6c1728e1f588e2b27eb1a3f84a250b7b7bcb904
  server: &server-image sandbox-registry.cn-zhangjiakou.cr.aliyuncs.com/opensandbox/server@sha256:ae8dfbb277f40a39ff01ef35e5e1c10675acfe0fa9db15259b8f323e5efab778
  execd: &execd-image sandbox-registry.cn-zhangjiakou.cr.aliyuncs.com/opensandbox/execd@sha256:0d8f44cf4194732719aa79999d4b120c98bdab02bc61e9ad13f75f83af4c2684
  egress: &egress-image sandbox-registry.cn-zhangjiakou.cr.aliyuncs.com/opensandbox/egress@sha256:db7345d567b0970f384b8e3fa7a93a71b7f43d4b16bb2009de34096e9a87b3b5

x-app-image: &app-image
  image: *application-image

# These one-shot services make `docker compose pull` fetch every sandbox image.
x-image-preload: &image-preload
  entrypoint: ["/bin/true"]
  restart: "no"
  network_mode: none
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

x-backend-environment: &backend-environment
  ENVIRONMENT: *environment
  PUBLIC_APP_URL: *public-app-url
  BOOTSTRAP_ADMIN_USERNAME: admin
  BOOTSTRAP_ADMIN_EMAIL: admin@example.com
  BOOTSTRAP_ADMIN_NAME: 系统管理员
  BOOTSTRAP_ADMIN_PASSWORD: *admin-password
  MANAGED_USER_INITIAL_PASSWORD: *managed-user-password
  DATABASE_URL: ""
  POSTGRES_DB: nexaflow
  POSTGRES_USER: nexaflow
  POSTGRES_PASSWORD: *postgres-password
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  CELERY_BROKER_URL: redis://redis:6379/0
  KNOWLEDGE_STORAGE_DIR: /data/knowledge
  QDRANT_URL: http://qdrant:6333
  OPENSANDBOX_URL: http://opensandbox:8088
  OPENSANDBOX_API_KEY: *sandbox-api-key
  OPENSANDBOX_IMAGE: *execution-image
  OPENSANDBOX_ALLOW_INSECURE_HTTP: "1"
  OPENSANDBOX_MAX_SANDBOXES: "4"

services:
  execution-image:
    <<: *image-preload
    image: *execution-image

  execd-image:
    <<: *image-preload
    image: *execd-image

  egress-image:
    <<: *image-preload
    image: *egress-image

  opensandbox:
    configs:
      - source: opensandbox
        target: /etc/opensandbox/config.toml
    depends_on:
      execution-image:
        condition: service_completed_successfully
      execd-image:
        condition: service_completed_successfully
      egress-image:
        condition: service_completed_successfully
    image: *server-image
    init: true
    restart: unless-stopped
    environment:
      OPENSANDBOX_SERVER_API_KEY: *sandbox-api-key
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./deploy/data/opensandbox:/var/lib/opensandbox
    extra_hosts:
      - host.docker.internal:host-gateway
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/health', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 20

  db:
    image: *postgres-image
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexaflow
      POSTGRES_USER: nexaflow
      POSTGRES_PASSWORD: *postgres-password
    volumes:
      - ./deploy/data/postgresql:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "PGAPPNAME=nexaflow-healthcheck pg_isready -U nexaflow -d nexaflow"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - ./deploy/data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.19.0
    restart: unless-stopped
    volumes:
      - ./deploy/data/qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    <<: *app-image
    init: true
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment: *backend-environment
    depends_on:
      db:
        condition: service_healthy

  app:
    <<: *app-image
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    command: ["python", "/etc/nexaflow/app.py"]
    configs:
      - source: app-supervisor
        target: /etc/nexaflow/app.py
    environment:
      <<: *backend-environment
      AUTOSCALE_KEEPALIVE: "5"
    volumes:
      - ./deploy/data/uploads:/data/knowledge
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Published Next.js builds and the optional Nginx example use these names.
    networks:
      default:
        aliases: [api, frontend]
    ports:
      - *web-port
    healthcheck:
      test: ["CMD", "python", "/etc/nexaflow/app.py", "--healthcheck"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 20
    depends_on:
      opensandbox:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

# Docker isolation is explicit. Kata is an optional separate execution host.
configs:
  app-supervisor:
    content: |
      """Run the four trusted business processes in one container."""

      import os
      import signal
      import subprocess
      import sys
      import threading
      import time
      import urllib.request

      SHUTDOWN_TIMEOUT = 20
      SERVICES = (
          (
              "api",
              [
                  sys.executable,
                  "-m",
                  "uvicorn",
                  "app.main:app",
                  "--host",
                  "0.0.0.0",
                  "--port",
                  "8000",
                  "--timeout-graceful-shutdown",
                  "8",
              ],
              "/app",
          ),
          (
              "worker",
              [
                  sys.executable,
                  "scripts/worker.py",
                  "--role=background",
                  "--hostname=background@%h",
                  "--autoscale=10,0",
              ],
              "/app",
          ),
          (
              "agent-worker",
              [sys.executable, "scripts/worker.py", "--role=agents", "--hostname=agents@%h"],
              "/app",
          ),
          ("frontend", ["/opt/node/bin/node", "server.js"], "/opt/frontend"),
      )


      def environment(label):
          if label != "frontend":
              return os.environ.copy()
          # Keep backend credentials out of the frontend process environment.
          return {
              "PATH": os.environ.get("PATH", os.defpath),
              "NODE_ENV": "production",
              "NEXT_TELEMETRY_DISABLED": "1",
              "HOSTNAME": "0.0.0.0",
              "NEXAFLOW_API_PROXY": "http://api:8000",
          }


      def forward_output(label, stream):
          with stream:
              for line in stream:
                  print(f"[{label}] {line.rstrip()}", flush=True)


      def signal_group(process, signum):
          try:
              os.killpg(process.pid, signum)
          except ProcessLookupError:
              pass


      def supervise(services):
          processes = []
          output_threads = []
          stopping = False
          result = 0

          def request_stop(signum, frame):
              nonlocal stopping
              stopping = True

          previous = {
              signum: signal.signal(signum, request_stop)
              for signum in (signal.SIGTERM, signal.SIGINT)
          }
          try:
              for label, command, cwd in services:
                  if stopping:
                      break
                  process = subprocess.Popen(
                      command,
                      cwd=cwd,
                      env=environment(label),
                      start_new_session=True,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                      text=True,
                      errors="replace",
                      bufsize=1,
                  )
                  processes.append((label, process))
                  thread = threading.Thread(
                      target=forward_output, args=(label, process.stdout), daemon=True
                  )
                  thread.start()
                  output_threads.append(thread)
              while not stopping:
                  for label, process in processes:
                      code = process.poll()
                      if code is not None:
                          print(f"[app] {label} exited ({code}); stopping app", flush=True)
                          result = 1
                          stopping = True
                          break
                  if not stopping:
                      time.sleep(0.2)
          except OSError as exc:
              print(f"[app] Cannot start service: {exc}", file=sys.stderr, flush=True)
              result = 1
          finally:
              for label, process in processes:
                  signal_group(process, signal.SIGTERM)
              deadline = time.monotonic() + SHUTDOWN_TIMEOUT
              for label, process in processes:
                  try:
                      process.wait(timeout=max(0, deadline - time.monotonic()))
                  except subprocess.TimeoutExpired:
                      pass
              # Also remove descendants left behind by an exited process leader.
              for label, process in processes:
                  signal_group(process, signal.SIGKILL)
              for label, process in processes:
                  process.wait()
              for thread in output_threads:
                  thread.join(timeout=1)
              for signum, handler in previous.items():
                  signal.signal(signum, handler)
          return result


      def healthcheck():
          for port in (8000, 3000):
              with urllib.request.urlopen(f"http://127.0.0.1:{port}/health", timeout=2):
                  pass


      if __name__ == "__main__":
          if sys.argv[1:] == ["--healthcheck"]:
              healthcheck()
          else:
              sys.exit(supervise(SERVICES))

  opensandbox:
    content: |
      # Explicit single-host Docker deployment. For VM isolation, use configure.py
      # on a Kata-capable execution host instead. The API key comes from the environment.
      [server]
      host = "0.0.0.0"
      port = 8088
      max_sandbox_timeout_seconds = 1860

      [runtime]
      type = "docker"
      execd_image = "sandbox-registry.cn-zhangjiakou.cr.aliyuncs.com/opensandbox/execd@sha256:0d8f44cf4194732719aa79999d4b120c98bdab02bc61e9ad13f75f83af4c2684"

      [store]
      type = "sqlite"
      path = "/var/lib/opensandbox/sandboxes.db"

      [storage]
      allowed_host_paths = []

      [docker]
      network_mode = "bridge"
      host_ip = "host.docker.internal"
      pids_limit = 96
      no_new_privileges = true
      drop_capabilities = ["AUDIT_WRITE", "MKNOD", "NET_ADMIN", "NET_RAW", "SYS_ADMIN", "SYS_MODULE", "SYS_PTRACE", "SYS_TIME", "SYS_TTY_CONFIG"]
      sandbox_env = {}
      sandbox_binds = []

      [ingress]
      mode = "direct"

      [egress]
      image = "sandbox-registry.cn-zhangjiakou.cr.aliyuncs.com/opensandbox/egress@sha256:db7345d567b0970f384b8e3fa7a93a71b7f43d4b16bb2009de34096e9a87b3b5"
      mode = "dns+nft"
      disable_ipv6 = true
      readiness_timeout = 30
